name: Build and Push Docker Image

# 触发：推 master、打 v* tag、手动。
# 镜像标签：始终推 latest；tag 构建额外带 tag 名；非 tag 构建（master / 手动）额外带北京时间戳（如 20261009-234500）。
on:
  push:
    branches:
      - "master"
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: qazserena/cow-manager-backend

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 测试不过不出镜像
      - name: vet 与测试
        run: |
          gofmt -l . | tee /tmp/gofmt.out
          test ! -s /tmp/gofmt.out
          go vet ./...
          go test ./...

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: qazserena
          password: qazserena2022

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=ref,event=tag
            type=raw,value={{date 'YYYYMMDD-HHmmss' tz='Asia/Shanghai'}},enable=${{ github.ref_type != 'tag' }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 输出镜像标签
        run: echo "${{ steps.meta.outputs.tags }}"
